---
# Post-merge job that builds S2I container images and pushes them
# to quay.io.  Defined here (config project) so it can reference
# the quay_nextgen_zuulgithubci secret.  The actual build/push
# logic lives in s2i-openstack-containers; the wrapper playbooks
# in this repo inject the credentials and delegate via include_tasks.

- job:
    name: s2i-openstack-container-build-push
    parent: base
    description: |
      Build S2I container images from committed source pins and push
      them to quay.io.  Runs post-merge to keep the upstream
      last-known-good baseline images current.

      Set s2i_ci_images to 'all' (default) to rebuild everything, or
      to a list of targets for selective rebuilds.
    timeout: 7200
    nodeset: s2i-openstack-containers-image-builder
    required-projects:
      - github.com/openstack-k8s-operators/s2i-openstack-containers
      - opendev.org/zuul/zuul-jobs
    pre-run: playbooks/s2i/prepare-host.yaml
    run: playbooks/s2i/push-to-quay.yaml
    post-run: playbooks/s2i/post.yaml
    secrets:
      - name: quay_nextgen_zuulgithubci
        secret: quay_nextgen_zuulgithubci
    vars:
      s2i_ci_container_project: >-
        github.com/openstack-k8s-operators/s2i-openstack-containers
      s2i_ci_stream: master
      s2i_ci_images: all
