---
# Post-merge job that builds S2I container images and pushes them to
# quay.io.  Defined in the config project so it can use the
# quay_io_openstack_s2i_containers_robot secret.
#
# SECURITY architecture:
#   pre-run (build-images.yaml) invokes untrusted build.sh to compile
#   container images. At this point no buildah login has been called,
#   so there is no registry auth file on disk for build.sh to use.
#
#   The build phase also validates that all image refs produced by
#   build.sh match the expected registry/namespace prefix, preventing
#   a compromised build.sh from redirecting pushes.
#
#   run (push-images.yaml) performs buildah login and pushes images
#   directly via trusted Ansible code. Untrusted build.sh is never
#   invoked after credentials are present on disk.
#
# Do NOT add this job to github-check or github-manual pipelines.
# Those pipelines run on PR code and would expose the push secret.

- job:
    name: s2i-openstack-container-build-push
    parent: base
    description: |
      Build S2I container images from committed source pins and push
      them to quay.io.  Runs post-merge to keep the upstream
      last-known-good baseline images current.

      Set s2i_ci_images to 'all' (default) to rebuild everything, or
      to a list of targets for selective rebuilds.
    timeout: 7200
    attempts: 1
    nodeset: s2i-openstack-containers-image-builder
    required-projects:
      - github.com/openstack-k8s-operators/s2i-openstack-containers
      - opendev.org/zuul/zuul-jobs
    pre-run:
      - playbooks/s2i/prepare-host.yaml
      - playbooks/s2i/build-images.yaml
    run: playbooks/s2i/push-images.yaml
    post-run: playbooks/s2i/post.yaml
    secrets:
      - name: s2i_quay
        secret: quay_io_openstack_s2i_containers_robot
    # Honored on change pipelines; github-post (ref-updated) may ignore
    # this. Matches the GHA build-and-push path filter.
    files:
      - ^build\.sh$
      - ^tox\.ini$
      - ^containers/.*
    vars:
      s2i_ci_container_project: >-
        github.com/openstack-k8s-operators/s2i-openstack-containers
      s2i_ci_stream: master
      s2i_ci_images: all
      s2i_quay_namespace: openstack-s2i-containers
      s2i_quay_tag_expiration_weeks: 12
