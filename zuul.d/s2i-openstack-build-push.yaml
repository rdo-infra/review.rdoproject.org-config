---
# Post-merge job that builds S2I container images and pushes them
# to quay.io.  Defined here (config project) so it can use the
# quay_io_openstack_s2i_containers_robot secret.  Playbooks in this
# repo are trusted: they log in with the robot, call build.sh from
# the s2i checkout, then use the OAuth token for Quay API calls.
# They must not include_tasks YAML from the untrusted s2i repo.

- job:
    name: s2i-openstack-container-build-push
    parent: base
    description: |
      Build S2I container images from committed source pins and push
      them to quay.io.  Runs post-merge to keep the upstream
      last-known-good baseline images current.

      Set s2i_ci_images to 'all' (default) to rebuild everything, or
      to a list of targets for selective rebuilds.
    timeout: 7200
    attempts: 1
    nodeset: s2i-openstack-containers-image-builder
    required-projects:
      - github.com/openstack-k8s-operators/s2i-openstack-containers
      - opendev.org/zuul/zuul-jobs
    pre-run: playbooks/s2i/prepare-host.yaml
    run: playbooks/s2i/push-to-quay.yaml
    post-run: playbooks/s2i/post.yaml
    secrets:
      - name: s2i_quay
        secret: quay_io_openstack_s2i_containers_robot
    # DNM: files: dropped so a config-repo experimental run is not
    # skipped (matcher is evaluated against this change, not s2i).
    # Restore before abandoning:
    # files:
    #   - ^build\.sh$
    #   - ^tox\.ini$
    #   - ^containers/.*
    vars:
      s2i_ci_container_project: >-
        github.com/openstack-k8s-operators/s2i-openstack-containers
      s2i_ci_stream: master
      s2i_ci_images: all
      s2i_quay_namespace: openstack-s2i-containers
      s2i_quay_tag_expiration_weeks: 12
