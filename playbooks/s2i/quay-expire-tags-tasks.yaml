---
# Set a per-tag expiration on master-<sha> pointers after a successful
# push. Does not affect master-latest or other tags on the same image.
# Auth uses the OAuth token, not the robot password.
- name: Derive the commit-sha tag name for expiration
  ansible.builtin.set_fact:
    s2i_quay_sha_tag: "{{ s2i_quay_tag.split(',')[0] }}"

- name: Compute Quay tag expiration timestamp
  ansible.builtin.command:
    cmd: >-
      date -d "+{{ s2i_quay_tag_expiration_weeks }} weeks" +%s
  register: s2i_quay_tag_expiration_cmd
  changed_when: false

- name: Set expiration on commit-sha Quay tags
  ansible.builtin.shell: |
    curl -sS --max-time 120 \
      -o "{{ s2i_ci_log_dir }}/quay-expire-{{ item }}.json" \
      -w "%{http_code}" \
      -X PUT "https://{{ s2i_quay_registry }}/api/v1/repository/{{ s2i_quay_namespace }}/{{ item }}/tag/{{ s2i_quay_sha_tag }}" \
      -H "Authorization: Bearer ${S2I_QUAY_OAUTH_TOKEN}" \
      -H "Content-Type: application/json" \
      -d '{"expiration": {{ s2i_quay_tag_expiration_cmd.stdout | int }}}' \
      > "{{ s2i_ci_log_dir }}/quay-expire-{{ item }}.http"
  environment:
    S2I_QUAY_OAUTH_TOKEN: "{{ s2i_quay.oauth_token }}"
  loop: "{{ s2i_quay_repo_names }}"
  loop_control:
    label: "{{ item }}"
  no_log: true
  changed_when: false

- name: Check Quay tag expiration HTTP status
  ansible.builtin.shell: |
    echo "HTTP $(cat "{{ s2i_ci_log_dir }}/quay-expire-{{ item }}.http")"
    cat "{{ s2i_ci_log_dir }}/quay-expire-{{ item }}.json"
  register: s2i_quay_expire_http
  loop: "{{ s2i_quay_repo_names }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  failed_when: s2i_quay_expire_http.stdout_lines[0] not in ["HTTP 200", "HTTP 201"]
