---
# One authenticated Quay API request for s2i_quay_repo.
# Restored to ansible.builtin.uri after debugging the HTTP 415
# failures: a trailing newline in the Zuul secret corrupted the
# Authorization header when passed through shell curl. The uri
# module sets headers in Python and body_format handles
# Content-Type, avoiding both issues.
#
# Required vars:
#   s2i_quay_repo: repository name
#   s2i_quay_http_prefix: filename stem for log context
#   s2i_quay_http_method: POST/PUT/...
#   s2i_quay_http_url: full URL
#   s2i_quay_http_body: dict (serialized as JSON by body_format)
#   s2i_quay_http_ok: list of accepted status codes (integers)
- name: "Quay API {{ s2i_quay_http_prefix }} {{ s2i_quay_repo }}"
  ansible.builtin.uri:
    url: "{{ s2i_quay_http_url }}"
    method: "{{ s2i_quay_http_method }}"
    headers:
      Authorization: "Bearer {{ s2i_quay.oauth_token | trim }}"
    body: "{{ s2i_quay_http_body }}"
    body_format: json
    status_code: "{{ s2i_quay_http_ok }}"
    timeout: 120
  register: s2i_quay_result
  no_log: true

- name: "Log Quay API response for {{ s2i_quay_http_prefix }} {{ s2i_quay_repo }}"
  ansible.builtin.debug:
    msg: >-
      HTTP {{ s2i_quay_result.status }}
      {{ s2i_quay_result.json | default(s2i_quay_result.msg | default('')) }}
