---
# One authenticated Quay API request for s2i_quay_repo.
# Token stays in the python environment of a no_log task. Status and
# body are written to files and printed by the follow-up task.
#
# curl --data-binary and curl --json both still produced HTTP 415
# from Quay (Content-Type not application/json) on the CentOS 10
# builder. urllib sets that header explicitly and strips the token.
#
# Required vars:
#   s2i_quay_repo: repository name
#   s2i_quay_http_prefix: filename stem (quay-create, quay-grant, ...)
#   s2i_quay_http_method: POST/PUT/...
#   s2i_quay_http_url: full URL
#   s2i_quay_http_body: mapping serialized with to_json
#   s2i_quay_http_ok: accepted first lines, e.g. "HTTP 201"
- name: Write Quay API JSON body
  ansible.builtin.copy:
    dest: "{{ s2i_ci_log_dir }}/{{ s2i_quay_http_prefix }}-{{ s2i_quay_repo }}.body"
    content: "{{ s2i_quay_http_body | to_json }}"
    mode: "0644"

- name: Call the Quay API
  ansible.builtin.shell: |
    python3 - <<'PY'
    import os
    import urllib.error
    import urllib.request

    body_path = os.environ["S2I_QUAY_BODY"]
    out_json = os.environ["S2I_QUAY_OUT_JSON"]
    out_http = os.environ["S2I_QUAY_OUT_HTTP"]
    out_err = os.environ["S2I_QUAY_OUT_ERR"]
    url = os.environ["S2I_QUAY_URL"]
    method = os.environ["S2I_QUAY_METHOD"]
    token = os.environ["S2I_QUAY_OAUTH_TOKEN"].strip()
    with open(body_path, "rb") as handle:
        data = handle.read()
    request = urllib.request.Request(
        url,
        data=data,
        method=method,
        headers={
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json",
            "Accept": "application/json",
        },
    )
    err_text = ""
    try:
        with urllib.request.urlopen(request, timeout=120) as response:
            code = response.getcode()
            body = response.read()
    except urllib.error.HTTPError as exc:
        code = exc.code
        body = exc.read()
    except Exception as exc:
        code = 0
        body = b""
        err_text = str(exc) + "\n"
    with open(out_err, "w", encoding="utf-8") as handle:
        handle.write(err_text)
    with open(out_http, "w", encoding="utf-8") as handle:
        handle.write(str(code))
    with open(out_json, "wb") as handle:
        handle.write(body)
    PY
  environment:
    S2I_QUAY_OAUTH_TOKEN: "{{ s2i_quay.oauth_token }}"
    S2I_QUAY_BODY: "{{ s2i_ci_log_dir }}/{{ s2i_quay_http_prefix }}-{{ s2i_quay_repo }}.body"
    S2I_QUAY_OUT_JSON: "{{ s2i_ci_log_dir }}/{{ s2i_quay_http_prefix }}-{{ s2i_quay_repo }}.json"
    S2I_QUAY_OUT_HTTP: "{{ s2i_ci_log_dir }}/{{ s2i_quay_http_prefix }}-{{ s2i_quay_repo }}.http"
    S2I_QUAY_OUT_ERR: "{{ s2i_ci_log_dir }}/{{ s2i_quay_http_prefix }}-{{ s2i_quay_repo }}.err"
    S2I_QUAY_URL: "{{ s2i_quay_http_url }}"
    S2I_QUAY_METHOD: "{{ s2i_quay_http_method }}"
  no_log: true
  failed_when: false
  changed_when: false

- name: Check Quay API HTTP status
  ansible.builtin.shell: |
    echo "HTTP $(cat "{{ s2i_ci_log_dir }}/{{ s2i_quay_http_prefix }}-{{ s2i_quay_repo }}.http")"
    cat "{{ s2i_ci_log_dir }}/{{ s2i_quay_http_prefix }}-{{ s2i_quay_repo }}.err" \
      "{{ s2i_ci_log_dir }}/{{ s2i_quay_http_prefix }}-{{ s2i_quay_repo }}.json"
  register: s2i_quay_http
  changed_when: false
  failed_when: >-
    s2i_quay_http.rc != 0 or
    (s2i_quay_http.stdout_lines | default([]) | first | default(''))
    not in s2i_quay_http_ok
