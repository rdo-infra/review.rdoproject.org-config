---
# Ensure Quay.io repositories exist before the first push.
# Requires s2i_quay_image_refs from the build play. Auth uses the
# OAuth token, not the robot password.
- name: Derive unique Quay repository names from image refs
  ansible.builtin.set_fact:
    s2i_quay_repo_names: >-
      {{ s2i_quay_image_refs.stdout_lines |
         reject('equalto', '') |
         map('regex_replace', '^.*\/([^/:]+):.*$', '\1') |
         unique |
         list }}

- name: Ensure Quay repositories exist and are public
  ansible.builtin.uri:
    url: "https://{{ s2i_quay_registry }}/api/v1/repository"
    method: POST
    headers:
      Authorization: "Bearer {{ s2i_quay.oauth_token }}"
      Content-Type: application/json
    body_format: json
    body:
      repository: "{{ item }}"
      namespace: "{{ s2i_quay_namespace }}"
      description: Created automatically via CI
      visibility: public
    status_code: [201, 400]
  loop: "{{ s2i_quay_repo_names }}"
  no_log: true

# createRepo has no ACL field. Grant the robot write (includes read)
# via changeUserPermissions. Robots use the user permission endpoint
# with the org+name username. The + must be encoded in the path.
# Requires OAuth scope repo:admin. Runs even when the repo already
# existed so a first-time robot grant still applies.
- name: Grant the Quay robot write on each repository
  ansible.builtin.uri:
    url: >-
      https://{{ s2i_quay_registry }}/api/v1/repository/{{
      s2i_quay_namespace }}/{{ item }}/permissions/user/{{
      s2i_quay.username | replace('+', '%2B') }}
    method: PUT
    headers:
      Authorization: "Bearer {{ s2i_quay.oauth_token }}"
      Content-Type: application/json
    body_format: json
    body:
      role: write
    status_code: [200, 201]
  loop: "{{ s2i_quay_repo_names }}"
  no_log: true
