---
# Trusted push phase: log in to the registry, push validated images,
# and perform Quay API housekeeping. This playbook runs AFTER
# build-images.yaml (pre-run) so that untrusted build.sh never has
# access to a buildah auth file on disk. Do not invoke build.sh here.
- name: Push S2I images to quay.io
  hosts: builder
  vars:
    s2i_ci_output_dir: "{{ ansible_user_dir }}/zuul-output"
    s2i_ci_log_dir: "{{ s2i_ci_output_dir }}/logs/container-build"
    s2i_ci_workspace_root: "{{ ansible_user_dir }}"
    s2i_quay_registry: quay.io
    s2i_quay_tag: >-
      {{ s2i_ci_stream }}-{{ zuul.newrev | default(zuul.change | default('dev')) }},{{ s2i_ci_stream }}-latest

  tasks:
    - name: Read validated image refs from build phase
      ansible.builtin.slurp:
        src: "{{ s2i_ci_log_dir }}/image-refs.txt"
      register: s2i_refs_file

    - name: Parse image refs
      ansible.builtin.set_fact:
        s2i_quay_image_refs_list: "{{ (s2i_refs_file.content | b64decode).splitlines() | reject('equalto', '') | list }}"

    - name: Derive unique repository names from image refs
      ansible.builtin.set_fact:
        s2i_quay_image_refs:
          stdout_lines: "{{ s2i_quay_image_refs_list }}"

    - name: Re-validate image refs before login
      ansible.builtin.include_tasks: validate-refs.yaml

    - name: Log in to quay.io
      ansible.builtin.command:
        argv:
          - buildah
          - login
          - --username
          - "{{ s2i_quay.username }}"
          - --password-stdin
          - "{{ s2i_quay_registry }}"
        stdin: "{{ s2i_quay.password }}"
      no_log: true
      changed_when: true

    - name: Push images and run Quay housekeeping
      block:
        - name: Ensure Quay repositories exist before push
          ansible.builtin.include_tasks: quay-ensure-repos-tasks.yaml

        - name: Ensure digest output directory exists
          ansible.builtin.file:
            path: "{{ s2i_ci_log_dir }}/digests"
            state: directory
            mode: "0755"

        - name: Push each validated image ref
          vars:
            s2i_quay_digest_name: "{{ item.split('/')[-1].split(':')[0] }}"
          ansible.builtin.command:
            argv:
              - buildah
              - push
              - --digestfile
              - "{{ s2i_ci_log_dir }}/digests/{{ s2i_quay_digest_name }}.digest"
              - "{{ item }}"
          loop: "{{ s2i_quay_image_refs_list }}"
          loop_control:
            label: "{{ item }}"
          register: s2i_quay_push
          changed_when: true

        - name: Save push output
          ansible.builtin.copy:
            dest: "{{ s2i_ci_log_dir }}/quay-push.log"
            mode: "0644"
            content: |
              {% for result in s2i_quay_push.results %}
              === {{ result.item }} ===
              {{ result.stdout | default('') }}
              {{ result.stderr | default('') }}
              {% endfor %}

        - name: Set expiration on commit-sha Quay tags
          ansible.builtin.include_tasks: quay-expire-tags-tasks.yaml
      always:
        - name: Log out of quay.io
          ansible.builtin.command:
            argv:
              - buildah
              - logout
              - "{{ s2i_quay_registry }}"
          changed_when: true
          failed_when: false

    # Catalog only needs local digest files and image-mappings.yaml.
    # Run it after logout so a mapping/schema failure cannot leave a
    # Quay auth file on disk, and so a failed catalog is not mixed
    # into the push block (images may already be on Quay).
    - name: Generate digest catalog for the pushed set
      block:
        - name: Build content-set.yaml from digests and image mappings
          ansible.builtin.include_tasks: generate-content-set-tasks.yaml
      rescue:
        - name: Report that push succeeded but the catalog did not
          ansible.builtin.fail:
            msg: >-
              Images were pushed to quay.io, but content-set.yaml was
              not written. The catalog step failed; re-run after
              fixing generate-content-set-tasks.yaml or
              containers/image-mappings.yaml.
