- hosts: localhost
  roles:
    - role: log-inventory
      zuul_log_url: "https://gateway-cloud-softwarefactory.apps.ocp.cloud.ci.centos.org/logs"
    - role: emit-job-header
      zuul_log_url: "https://gateway-cloud-softwarefactory.apps.ocp.cloud.ci.centos.org/logs"

- hosts: all
  pre_tasks:
    # NOTE(pabelanger): Until we hit the validate-host role, we have a minimal
    # set of ansible variables collected by zuul-executor. This doesn't include
    # network variables (ansible_default_ipv4 / ansible_default_ipv6) so gather
    # these variables as they are important to the configure-unbound role.
    - name: Gather network facts
      setup:
        gather_subset: 'network'

  tasks:
    - include_role: name=start-zuul-console
    - block:
        - include_role: name=add-build-sshkey
        - include_role: name=validate-host
      when: "ansible_connection != 'kubectl'"
    - block:
        - include_role: name=prepare-workspace-openshift
        - include_role: name=remove-zuul-sshkey
        # prepare-workspace-openshift runs `oc exec`/`oc rsync` as plain
        # command tasks (opendev.org/zuul/zuul-jobs), bypassing the
        # kubectl connection plugin entirely, so ansible_kubectl_extra_args
        # never reaches them and they write their cache under the real
        # build home. Clean up here, last in this block, so Zuul's
        # home-dir scan (which runs between playbooks) never sees it.
        - name: Clean up oc/kubectl cache left by prepare-workspace-openshift
          delegate_to: localhost
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "~/.kube/http-cache"
            - "~/.kube/cache"
      run_once: true
      when: "ansible_connection == 'kubectl'"
    - import_role: name=ensure-output-dirs
      when: ansible_user_dir is defined
