- hosts: all
  tasks:
    - block:
        - include_role: name=fetch-output
      when:
        - "ansible_connection != 'kubectl'"
        - ansible_user_dir is defined
    - block:
        - include_role: name=fetch-output-openshift
      when:
        - "ansible_connection == 'kubectl'"
        - ansible_user_dir is defined
    - import_role: name=merge-output-to-logs
      when: ansible_user_dir is defined

- hosts: all
  # NOTE(pabelanger): We ignore_errors for the following tasks as not to fail
  # successful jobs.
  ignore_errors: yes
  roles:
    - remove-build-sshkey
  tasks:
    - name: Clean up stray ssh known_hosts backup
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "~/.ssh/known_hosts.old"
        state: absent
